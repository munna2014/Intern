version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: staffflow-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: staffflow 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - staffflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 20s
      retries: 10

  # Yii2 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staffflow-backend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: staffflow
      DB_USER: root
      DB_PASSWORD: root
    volumes:
      - ./backend:/var/www/html
    networks:
      - staffflow-network

  # React Frontend
  frontend:
    image: node:18-alpine
    container_name: staffflow-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    networks:
      - staffflow-network
    stdin_open: true
    tty: true
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules)\" ]; then npm install; fi && npm start"

  # phpMyAdmin - Database Web Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: staffflow-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    networks:
      - staffflow-network

networks:
  staffflow-network:
    driver: bridge

volumes:
  db_data:
  frontend_node_modules:
